# GenSSL 前端（管理界面）生产环境 Nginx 配置。
# 本次管理界面先使用 HTTP。日后可用本平台签发的证书为该站点加 TLS。
# 监听非特权端口 18347；docker compose 映射为 18347:18347。
# 这与「Nginx 配置」页生成的业务站点证书示例不是同一份配置。

server {
    listen 18347;
    listen [::]:18347;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 静态资源开启 gzip
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # 入口 HTML 不要长期缓存，以便发布后尽快拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Vite 带哈希的静态资源可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：未匹配到真实文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端，不要回退成 index.html
    # proxy_pass 不带路径，以保留完整 URI（例如 /api/health）
    location /api/ {
        proxy_pass http://backend:19347;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 测试连接和证书下载可能较慢或较大
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # 把下载文件名传给浏览器
        proxy_pass_header Content-Disposition;
        client_max_body_size 32m;
    }

    # 兼容恰好请求 /api（无尾部斜杠）的情况
    location = /api {
        proxy_pass http://backend:19347;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass_header Content-Disposition;
    }
}
